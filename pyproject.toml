[project]
name = "arctic-route-contracts"
version = "0.3.0"
description = "Shared immutable scenario, corridor, vessel, and run-context contracts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arctic-route-context = "arctic_route_contracts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctic_route_contracts"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "arctic_route_contracts/configs"
"schemas" = "arctic_route_contracts/schemas"

[tool.hatch.build.targets.sdist]
include = ["src", "configs", "schemas", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]
